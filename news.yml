name: Oppdater avis

on:
  schedule:
    - cron: "0 5,15 * * *"   # UTC = 07:00 og 17:00 norsk sommertid (06 og 16 om vinteren)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python build_news.py
      - name: Publiser
        run: |
          git config user.name "avis-bot"
          git config user.email "avis-bot@users.noreply.github.com"
          git add docs
          git commit -m "Oppdatert $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git push
