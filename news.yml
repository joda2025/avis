name: Oppdater avis

on:
  schedule:
    - cron: "0 5,15 * * *"   # UTC = 07:00 og 17:00 norsk sommertid (06 og 16 om vinteren)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_news.py
      - .github/workflows/news.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python build_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
